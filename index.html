let db,items=[],categories=[],filter='All',selected=new Set(),urls=new Map(),token=null,driveFolder=null,busy=false;const removedKey='cony-removed-v1';let removed=new Set(JSON.parse(localStorage.getItem(removedKey)||'[]'));function rememberRemoved(){localStorage.setItem(removedKey,JSON.stringify([...removed]))}const metaKey='cony-google-client-id';const clientId=window.CONY_GOOGLE_CLIENT_ID||localStorage.getItem(metaKey)||'';

$('#chips').onclick=e=>{let b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};$('#search').oninput=render;$('#uploadBtn').onclick=()=>$('#upload').click();$('#upload').onchange=async e=>{let fs=[...e.target.files].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;$('#status').textContent='Saving originals…';let ok=0;for(const f of fs){try{await put('items',{id:uid(),name:f.name,blob:f,type:f.type,added:Date.now()+ok,flagged:false,categories:filter!=='All'&&filter!=='Flagged'?[filter]:[],driveId:null});ok++}catch(err){message('Storage full or unavailable. Saved '+ok+' of '+fs.length);break}}e.target.value='';await refresh();if(token&&ok){await syncDrive();}else message(`${ok} image${ok===1?'':'s'} saved on this device. Connect Google to back up.`)};

function pngForClipboard(blob){if(blob.type==='image/png')return blob;return (async()=>{let bitmap,source,objectURL;try{if(typeof createImageBitmap==='function'){bitmap=await createImageBitmap(blob);source=bitmap}else{objectURL=URL.createObjectURL(blob);source=await new Promise((resolve,reject)=>{let img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=objectURL})}let canvas=document.createElement('canvas');canvas.width=source.width;canvas.height=source.height;let context=canvas.getContext('2d');if(!context)throw Error('Could not prepare this image');context.drawImage(source,0,0);return await new Promise((resolve,reject)=>canvas.toBlob(x=>x?resolve(x):reject(Error('Could not prepare this image')),'image/png'))}finally{bitmap?.close();if(objectURL)URL.revokeObjectURL(objectURL)}})()}

function settings(){openDialog(`<h2>Google Drive ☁</h2><p>Back up original memes and categories to your own Google Drive.</p><p class="smallnote">${token?'✓ Connected to Google Drive':'Connect your Google account to back up and restore images.'}</p><div class="row">${token?'':`<button class="btn cool" id="connect" ${window.CONY_GOOGLE_CLIENT_ID?'':'disabled'}>Connect Google</button>`}<button class="btn" id="sync" ${token?'':'disabled'}>Back up to Drive</button><button class="btn" id="restore" ${token?'':'disabled'}>Restore from Drive</button><button class="btn" id="disconnect" ${token?'':'disabled'}>Disconnect</button><button class="btn" id="cancelSettings">Close</button></div><p class="smallnote">${window.CONY_GOOGLE_CLIENT_ID?'Your backup goes to the Google account you choose. Restore it on another device with the same account.':'Google Drive connection is unavailable right now.'}</p>`);$('#cancelSettings').onclick=closeDialog;if(!token)$('#connect').onclick=connect;$('#sync').onclick=backup;$('#restore').onclick=restore;$('#disconnect').onclick=()=>{if(token)google.accounts.oauth2.revoke(token,()=>{});token=null;driveFolder=null;settings()}}$('#settingsBtn').onclick=settings;
async function connect(){const id=window.CONY_GOOGLE_CLIENT_ID;if(!id)return message('Google Drive connection is unavailable');if(location.protocol==='file:')return message('Open the hosted Cony site to connect Google');try{if(!window.google?.accounts?.oauth2){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=resolve;s.onerror=reject;document.head.append(s)})}google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>{if(r.error)return message('Google connection failed: '+r.error);token=r.access_token;driveFolder=null;settings();syncDrive()}}).requestAccessToken({prompt:'select_account consent'})}catch(e){message('Could not load Google sign-in')}}
async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+token,...opts.headers}});if(!r.ok)throw Error('Drive request failed ('+r.status+')');return r}async function folder(){if(driveFolder)return driveFolder;let q=encodeURIComponent("name = 'Cony' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");let data=await (await api('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)&spaces=drive')).json();if(data.files?.length)return driveFolder=data.files[0].id;let created=await(await api('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Cony',mimeType:'application/vnd.google-apps.folder'})})).json();return driveFolder=created.id}async function listFiles(parent){let out=[],page='';do{let u='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent("'"+parent+"' in parents and trashed = false")+'&fields=nextPageToken,files(id,name,mimeType)&page_size=1000'+(page?'&pageToken='+encodeURIComponent(page):'');let x=await(await api(u)).json();out.push(...x.files);page=x.nextPageToken||''}while(page);return out}async function uploadDrive(name,blob,parent,existing){let boundary='meme_'+uid().replace(/\W/g,''),metadata={name,parents:existing?undefined:[parent]},body=new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`,blob,`\r\n--${boundary}--`],{type:'multipart/related; boundary='+boundary});let u='https://www.googleapis.com/upload/drive/v3/files'+(existing?'/'+existing:'')+'?uploadType=multipart&fields=id';let r=await(await api(u,{method:existing?'PATCH':'POST',headers:{'Content-Type':body.type},body})).json();return r.id}
let syncTimer=null,syncAgain=false;
function scheduleSync(){if(!token)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncDrive()},600)}
async function backup(){return syncDrive()}
async function restore(){return syncDrive('restore')}
async function syncDrive(mode='sync'){if(!token)return;if(busy){syncAgain=true;return}busy=true;closeDialog();try{
 const f=await folder(),files=await listFiles(f),manifestFile=files.find(x=>x.name==='manifest.json');
 let previous={version:1,items:[],categories:[]};
 if(manifestFile)previous=await(await api('https://www.googleapis.com/drive/v3/files/'+manifestFile.id+'?alt=media')).json();
 const old=Array.isArray(previous.items)?previous.items:[],existing=new Set(items.map(x=>x.id));let restored=0,uploaded=0;
 for(let [i,x] of old.entries()){if(existing.has(x.id)||removed.has(x.id))continue;$('#status').textContent=`Restoring from Drive ${i+1}/${old.length}…`;
  const blob=await(await api('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(x.driveId)+'?alt=media')).blob();
  await put('items',{...x,blob});existing.add(x.id);restored++}
 for(const name of previous.categories||[])if(!categories.some(c=>c.name===name))await put('categories',{name});
 if(restored||previous.categories?.length)await refresh();
 if(mode!=='restore'){
  const remote=new Map(old.map(x=>[x.id,x]));
  for(let [i,x] of items.entries()){
   $('#status').textContent=`Backing up to Drive ${i+1}/${items.length}…`;
   const known=remote.get(x.id);if(!known?.driveId){x.driveId=await uploadDrive(x.id+'__'+x.name,x.blob,f);await put('items',x);uploaded++}else if(x.driveId!==known.driveId){x.driveId=known.driveId;await put('items',x)}
  }
  const records=items.map(x=>({id:x.id,name:x.name,type:x.type,added:x.added,flagged:x.flagged,categories:x.categories,driveId:x.driveId}));
  const json=new Blob([JSON.stringify({version:1,items:records,categories:categories.map(c=>c.name)},null,2)],{type:'application/json'});
  await uploadDrive('manifest.json',json,f,manifestFile?.id)
 }
 await refresh();message(mode==='restore'?`Restored ${restored} image${restored===1?'':'s'} from Drive`:`Drive synced · ${restored} restored, ${uploaded} backed up`)
}catch(e){message('Drive sync failed: '+e.message+'. Local images are still on this device.')}finally{busy=false;render();if(syncAgain){syncAgain=false;scheduleSync()}}}
initDB().then(refresh).catch(()=>{$('#status').textContent='Local storage is unavailable. Use a normal browser window.'});
</script></body></html>
